name: normalizador-ci

on:
  push:
    branches: [main]
    paths: ["normalizador_direcciones/**", ".github/workflows/normalizador-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["normalizador_direcciones/**", ".github/workflows/normalizador-ci.yml"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: normalizador_direcciones

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 3.14 is experimental: torch CPU wheel availability for it was not verified; 3.12 is the required job.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the Docker image; 3.14 is the version the suite is developed on.
        # The package floor is 3.11 (tomllib) but 3.11 is not exercised here.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: normalizador_direcciones/pyproject.toml

      # CPU-only torch first, so the extras below cannot pull the ~3 GB CUDA build.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package with its extras
        run: pip install -e ".[dev,api,sql,excel,geo]"

      # The model artifacts (catastro_emb.pt) are not in git: tests that need them are marked
      # `requires_artifacts` and are skipped here. Everything else runs against stub models.
      - name: Run the tests
        run: python -m pytest -q
