name: publish-guard

# Path/size/secret-pattern guard. The real-address scan needs private data that
# CI does not have, so it runs locally (see scripts/pre-push and the README).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard self-tests
        run: python -m unittest discover -s tests -v
      - name: Publish guard (tracked files)
        run: python scripts/check_publishable.py
